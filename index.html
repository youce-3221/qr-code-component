  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

<body>
  <head></head>
  <main>
      <div class="div1">
        <img src="image-qr-code.png" alt="Qr code" width="270px" style="border-radius:10px; margin-top:15px;"><img>
        <p style="font-weight:780; font-size:20px; color:hsl(218, 44%, 22%); text-indent:5px; margin-bottom:13px;">Improve your front-end<br>skills by building projects</p>
